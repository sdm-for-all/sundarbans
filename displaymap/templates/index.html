<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Earth Engine Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }
    header { position: relative; z-index: 1000; }   /* above Leaflet's panes */
    #map { flex: 1; width: 100%; }                   /* still needs a height, now via flex */

  </style>
</head>
<body>

  <header>
    {% include "userinputhandler/header.html" %}
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  const map = L.map("map");

  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
      maxZoom: 19
    }
  ).addTo(map);

  // Keep a handle on the EE layer so it can be swapped later
  let eeLayer = null // L.tileLayer("{{ tile_url|escapejs }}", {
    //opacity: 0.6,
    //attribution: "Google Earth Engine"
  //}).addTo(map);  
  // used to have elevation for the whole world, no need to display that all the time though!
  // the elevation map still exists in views.py for the actual bird models

  
  function setEELayer(tileUrl) {
    if (eeLayer) map.removeLayer(eeLayer);
    eeLayer = L.tileLayer(tileUrl, { opacity: 0.6, attribution: "Google Earth Engine" }).addTo(map);
  }

  // Fired by the Run button in userinputhandler
  document.addEventListener("sdm:run", (e) => {
    console.log("SDM run:", e.detail);
    if (e.detail.result.tile_url) setEELayer(e.detail.result.tile_url);
  });

  map.fitBounds([[21.4, 88.0], [22.8, 90.2]]);  // BOUNDING BOX  BBOX
  //[88.0, 21.4], [90.2, 22.8]
  </script>
{% include "info/panel.html" %}
</body>
</html>
