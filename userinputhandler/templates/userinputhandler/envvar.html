<style>
    .envvarpanel {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        text-transform: none;      /* the button text is uppercase; don't inherit it */
        font-weight: 400;
        text-align: left;
    }
    .envvarpanel h3 { margin: 0 0 10px; font-size: 15px; }
    .env-status { margin: 0 0 10px; color: #6b7280; }
    .env-status:empty { display: none; }
    .env-hint { margin: 0 0 12px; color: #374151; font-size: 13px; }
    .env-hint:empty { display: none; }

    /* Filter | Scenario switch */
    .env-modes { display: flex; margin-bottom: 8px; border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden; }
    .env-modes[hidden] { display: none; }
    .env-modes button { flex: 1; padding: 6px 8px; border: 0; background: #f3f4f6; color: #111;
                        cursor: pointer; font-size: 13px; }
    .env-modes button + button { border-left: 1px solid #d1d5db; }
    .env-modes button.active { background: #1f2937; color: #fff; }
    .env-modes button:disabled { color: #9ca3af; cursor: not-allowed; }

    .env-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .env-presets:empty { display: none; }
    .env-presets button {
        flex: 1; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px;
        background: #f3f4f6; color: #111; cursor: pointer; font-size: 13px;
    }
    .env-presets button:hover { background: #e5e7eb; }
    .env-presets button.active { background: #1f2937; color: #fff; border-color: #1f2937; }

    .env-row { margin-bottom: 14px; }
    .env-row label { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .env-row output { font-variant-numeric: tabular-nums; color: #374151; }
    .env-row input[type=range] { width: 100%; }
    .env-range { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; }
</style>

<div class="envvarpanel" id="envvarpanel">
    <h3>Environmental variables</h3>
    <p class="env-status" id="env-status">Pick a species first.</p>

    <div class="env-modes" id="env-modes" hidden>
        <button type="button" data-mode="filter" class="active">Filter</button>
        <button type="button" data-mode="scenario">Scenario</button>
    </div>
    <p class="env-hint" id="env-hint"></p>

    <div id="env-filter">
        <div class="env-presets" id="env-presets"></div>
        <div id="env-rows"></div>
    </div>
    <div id="env-scenario" hidden>
        <div class="env-presets" id="sc-presets"></div>
        <div id="sc-rows"></div>
    </div>
</div>

<script>
(function () {
    const ENV_URL = "{% url 'userinputhandler:env_config' %}";
    const $ = id => document.getElementById(id);
    const statusEl = $('env-status'), modesEl = $('env-modes'), hintEl = $('env-hint');
    const filterEl = $('env-filter'), scenarioEl = $('env-scenario');
    const fPresetsEl = $('env-presets'), fRowsEl = $('env-rows');
    const sPresetsEl = $('sc-presets'), sRowsEl = $('sc-rows');

    const HINT = {
        filter:   'Hide places whose conditions fall outside the ranges you set.',
        scenario: 'Re-score every place as if each condition were shifted by these amounts.',
    };

    let cfg = null, mode = 'filter', token = 0;
    let fRows = [], sRows = [];
    const lo = r => r.querySelector('.lo'), hi = r => r.querySelector('.hi'), one = r => r.querySelector('.one');
    const num = x => +(+x).toFixed(4);
    const signed = x => (x > 0 ? '+' : '') + num(x);

    // ---------------- Filter rows (two handles) ----------------
    function refreshF(row, changed) {
        if (changed && +lo(row).value > +hi(row).value)      // keep lo <= hi
            (changed === lo(row) ? hi(row) : lo(row)).value = changed.value;
        row.querySelector('output').textContent =
            `${lo(row).value} – ${hi(row).value} ${row.dataset.unit}`;
    }
    window.getEnvValues = () => Object.fromEntries(
        fRows.map(r => [r.dataset.key, [+lo(r).value, +hi(r).value]]));

    function markFilterPreset() {
        const cur = window.getEnvValues();
        fPresetsEl.querySelectorAll('[data-preset]').forEach(b => {
            const v = cfg.presets[b.dataset.preset].values;
            b.classList.toggle('active', Object.keys(v).every(k =>
                cur[k] && v[k][0] === cur[k][0] && v[k][1] === cur[k][1]));
        });
    }

    // ---------------- Scenario rows (one handle, centred on "no change") ----------------
    function refreshS(row) {
        const v = +one(row).value;
        row.querySelector('output').textContent = v === 0 ? 'no change' : `${signed(v)} ${row.dataset.unit}`.trim();
    }
    window.getShiftValues = () => Object.fromEntries(sRows.map(r => [r.dataset.key, +one(r).value]));

    function markScenarioPreset() {
        const cur = window.getShiftValues();
        sPresetsEl.querySelectorAll('[data-preset]').forEach(b => {
            const v = cfg.scenario.presets[b.dataset.preset].values;
            b.classList.toggle('active', Object.keys(v).every(k => cur[k] !== undefined && num(v[k]) === num(cur[k])));
        });
    }

    // What RUN sends: the current mode's values, or null while nothing is loaded.
    window.getRunPayload = () => {
        if (!cfg) return null;
        return mode === 'scenario' ? {mode, shifts: window.getShiftValues()}
                                   : {mode, ranges: window.getEnvValues()};
    };
    window.sdmGetMode = () => mode;

    // ---------------- Drawing ----------------
    function presetButtons(into, presets, onClick) {
        into.innerHTML = '';
        Object.entries(presets).forEach(([key, p]) => {
            const b = document.createElement('button');
            b.type = 'button'; b.dataset.preset = key; b.textContent = p.label;
            b.addEventListener('click', () => onClick(key));
            into.appendChild(b);
        });
    }

    function renderFilter() {
        presetButtons(fPresetsEl, cfg.presets, key => {
            const v = cfg.presets[key].values;
            fRows.forEach(r => { const [a, b] = v[r.dataset.key]; lo(r).value = a; hi(r).value = b; refreshF(r); });
            markFilterPreset();
        });
        fRowsEl.innerHTML = '';
        fRows = cfg.env_vars.map(v => {
            const row = document.createElement('div');
            row.className = 'env-row'; row.dataset.key = v.key; row.dataset.unit = v.unit;
            row.innerHTML = `<label><span></span><output></output></label>
                <input type="range" class="lo"><input type="range" class="hi">
                <div class="env-range"><span></span><span></span></div>`;
            row.querySelector('label span').textContent = v.label;
            row.querySelectorAll('input').forEach(i => { i.min = v.min; i.max = v.max; i.step = v.step; });
            lo(row).value = v.min; hi(row).value = v.max;
            const ends = row.querySelectorAll('.env-range span');
            ends[0].textContent = v.min; ends[1].textContent = v.max;
            row.querySelectorAll('input').forEach(i =>
                i.addEventListener('input', () => { refreshF(row, i); markFilterPreset(); }));
            fRowsEl.appendChild(row);
            refreshF(row);
            return row;
        });
        markFilterPreset();
    }

    function renderScenario() {
        const sc = cfg.scenario;
        presetButtons(sPresetsEl, sc.presets, key => {
            const v = sc.presets[key].values;
            sRows.forEach(r => { one(r).value = v[r.dataset.key]; refreshS(r); });
            markScenarioPreset();
        });
        sRowsEl.innerHTML = '';
        sRows = sc.vars.map(v => {
            const row = document.createElement('div');
            row.className = 'env-row'; row.dataset.key = v.key; row.dataset.unit = v.unit;
            row.innerHTML = `<label><span></span><output></output></label>
                <input type="range" class="one">
                <div class="env-range"><span></span><span>0</span><span></span></div>`;
            row.querySelector('label span').textContent = v.label;
            const i = one(row); i.min = v.min; i.max = v.max; i.step = v.step; i.value = 0;
            const ends = row.querySelectorAll('.env-range span');
            ends[0].textContent = signed(v.min); ends[2].textContent = signed(v.max);
            i.addEventListener('input', () => { refreshS(row); markScenarioPreset(); });
            sRowsEl.appendChild(row);
            refreshS(row);
            return row;
        });
        markScenarioPreset();
    }

    function setMode(next, announce) {
        mode = next;
        modesEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
        filterEl.hidden = mode !== 'filter';
        scenarioEl.hidden = mode !== 'scenario';
        hintEl.textContent = HINT[mode];
        if (announce) document.dispatchEvent(new CustomEvent('sdm:mode', {detail: {mode}}));
    }

    modesEl.querySelectorAll('button').forEach(b =>
        b.addEventListener('click', () => { if (!b.disabled && b.dataset.mode !== mode) setMode(b.dataset.mode, true); }));

    function clearAll() {
        cfg = null; fRows = []; sRows = [];
        fPresetsEl.innerHTML = ''; fRowsEl.innerHTML = ''; sPresetsEl.innerHTML = ''; sRowsEl.innerHTML = '';
        modesEl.hidden = true; hintEl.textContent = '';
    }

    // Called by the species picker. Resolves to '' on success, an error message on
    // failure, or null if a newer selection replaced this one.
    window.sdmLoadEnv = async function (speciesId) {
        const mine = ++token;
        clearAll();
        statusEl.textContent = 'Loading ranges…';
        try {
            const res  = await fetch(ENV_URL + '?species_id=' + encodeURIComponent(speciesId));
            const text = await res.text();
            let data;
            try { data = JSON.parse(text); }
            catch { throw new Error('Server error ' + res.status + ' (see the runserver terminal)'); }
            if (!res.ok) throw new Error(data.error || 'Could not load variables');
            if (mine !== token) return null;

            cfg = data;
            renderFilter(); renderScenario();
            const sc = cfg.scenario, scBtn = modesEl.querySelector('[data-mode="scenario"]');
            scBtn.disabled = !sc.available;
            scBtn.title = sc.available ? '' : sc.reason;
            modesEl.hidden = false;
            if (!sc.available && mode === 'scenario') setMode('filter', true);
            else setMode(mode, false);
            if (!sc.available) hintEl.textContent = HINT.filter + ' (Scenario mode unavailable: ' + sc.reason + ')';
            statusEl.textContent = '';
            document.dispatchEvent(new CustomEvent('sdm:env', {detail: cfg}));
            return '';
        } catch (err) {
            if (mine !== token) return null;
            statusEl.textContent = err.message;
            return err.message;
        }
    };
})();
</script>
